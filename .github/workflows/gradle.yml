name: GitHub-Actions
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        distribution: oracle-openjdk
        java-version: latest
    - name: Build with Gradle
      run: ./gradlew build
